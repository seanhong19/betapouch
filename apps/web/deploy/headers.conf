# Security headers for serving apps/web/dist.
#
# The CSP in index.html covers most of this already, but three directives are
# ignored in a <meta> tag and MUST be real headers: frame-ancestors,
# X-Frame-Options and Strict-Transport-Security. Serve the app over https —
# WebCrypto is unavailable in an insecure context, so the app simply will not
# start otherwise.
#
# nginx form. Caddy/Apache/Netlify equivalents are in docs/DEPLOYMENT.md.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; connect-src 'self' blob: data: https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# Clickjacking. frame-ancestors is the modern control; X-Frame-Options is kept
# for older agents that ignore it.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;

# The app needs no ambient device access of its own beyond the camera the user
# explicitly invokes, so everything else is switched off at the platform level.
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(self), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Cross-origin isolation: keeps other origins from poking at this one, and
# stops this document being embedded as a resource elsewhere.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# The OCR engine is content-addressed by the build; cache it hard.
location /ocr/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The shell must revalidate so an update is actually picked up.
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

location = /sw.js {
    add_header Cache-Control "no-cache" always;
}
